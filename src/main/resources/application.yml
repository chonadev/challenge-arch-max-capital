server:
  port: 8080

spring:
  application:
    name: order-processing

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:orders_user}
    password: ${DB_PASSWORD:orders_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-processing-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.maxcapital.orderprocessing.dto
        isolation.level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: manual

app:
  kafka:
    topic-er-raw: er.raw
    topic-er-dlq: er.raw.dlq
    topic-settlement: settlement
  outbox:
    poll-interval-ms: 500
    batch-size: 100

instance:
  id: ${HOSTNAME:local}
